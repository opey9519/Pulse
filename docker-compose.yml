services:

  kafka:
    image: apache/kafka:4.0.1
    container_name: pulse-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  postgres:
    image: postgres:17
    container_name: pulse-postgres
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: pulse
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

  api:
    build:
      context: ./pulse
    container_name: pulse-api
    ports:
      - "8080:8080"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pulse
      SPRING_DATASOURCE_USERNAME: pulse
      SPRING_DATASOURCE_PASSWORD: pulse
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '(exec 3<>/dev/tcp/127.0.0.1/8080) 2>/dev/null || exit 1'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  loggenerator:
    build:
      context: ./loggenerator
    container_name: pulse-loggenerator
    environment:
      PULSE_URL: http://api:8080
      EVENTS: "100"
      RATE: "10"
    depends_on:
      api:
        condition: service_healthy
    command: >
      bash -lc '
        echo "Waiting for API at $${PULSE_URL}...";
        until (exec 3<>/dev/tcp/api/8080) 2>/dev/null; do sleep 1; done;
        echo "API is up. Generating logs...";
        mvn -q exec:java -Dexec.args="--events $${EVENTS} --rate $${RATE}"
      '

volumes:
  postgres-data: